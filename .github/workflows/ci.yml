name: CI

# Every pull request, and every push to main: build the app and run the tests. Branch pushes aren't run on
# their own, since their pull request already runs them (two runs per push filled the runner queue).
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR supersedes a run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: swift --version

      # The app target isn't built by `swift test`, so build everything first.
      - name: Build
        run: swift build

      # Xcode on the runner finds the Swift Testing macros itself, so plain `swift test` (not `make test`).
      - name: Test
        run: swift test
