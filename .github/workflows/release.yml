name: Release

# Push a version tag (git tag v0.2.0 && git push origin v0.2.0) to build the installer and publish it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and (re)publish, e.g. v0.1.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0 # the build number is the commit count

      - name: Toolchain
        run: swift --version

      # Xcode on the runner finds the Swift Testing macros itself, so plain `swift test` (not `make test`).
      - name: Test
        run: swift test

      - name: Build installer
        run: make dmg VERSION="${TAG#v}"

      # The description is the beta notice plus this version's CHANGELOG.md section (the step fails without one).
      - name: Publish release
        run: |
          VERSION="${TAG#v}"
          DMG="dist/ReviewDesk-${VERSION}.dmg"
          sh scripts/release-notes.sh "$VERSION" > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
            gh release upload "$TAG" "$DMG" --clobber
          else
            gh release create "$TAG" "$DMG" --title "ReviewDesk $VERSION" --notes-file notes.md --generate-notes
          fi
